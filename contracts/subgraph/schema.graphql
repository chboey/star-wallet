enum GoalStatus {
  ACTIVE
  COMPLETED
  CANCELLED
}

enum QuestStatus {
  ACTIVE
  SUBMITTED
  COMPLETED
  CANCELLED
}

enum StarRequestStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
}

enum RedemptionStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
}

enum ChildRegistrationStatus {
  PENDING
  ACCEPTED
  CANCELLED
}

type Family @entity(immutable: false) {
  id: ID!
  parent: Bytes!
  ensNode: Bytes!
  ensName: String!
  active: Boolean!
  vault: FamilyVault
  childCount: Int!
  createdAt: BigInt!
  updatedAt: BigInt!
  children: [Child!]! @derivedFrom(field: "family")
  childRegistrations: [ChildRegistration!]! @derivedFrom(field: "family")
  goals: [Goal!]! @derivedFrom(field: "family")
  redemptions: [Redemption!]! @derivedFrom(field: "family")
  quests: [Quest!]! @derivedFrom(field: "family")
  starRequests: [StarRequest!]! @derivedFrom(field: "family")
}

type FamilyVault @entity(immutable: false) {
  id: Bytes!
  questsAddress: Bytes!
  family: Family!
  parent: Bytes!
  emergencyAdmin: Bytes!
  aqua: Bytes!
  swapVm: Bytes!
  usdc: Bytes!
  weth: Bytes!
  aquaPaused: Boolean!
  createdAt: BigInt!
  updatedAt: BigInt!
  creationTransactionHash: Bytes!
  updatedTransactionHash: Bytes!
}

type ChildRegistration @entity(immutable: false) {
  id: Bytes!
  registrationId: Bytes!
  family: Family!
  childWallet: Bytes!
  ensNode: Bytes!
  ensName: String!
  child: Child
  status: ChildRegistrationStatus!
  proposedAt: BigInt!
  resolvedAt: BigInt
  resolvedBy: Bytes
  updatedAt: BigInt!
  proposalTransactionHash: Bytes!
  resolutionTransactionHash: Bytes
}

type PendingChildRegistration @entity(immutable: false) {
  id: Bytes!
  registration: ChildRegistration!
}

type Child @entity(immutable: false) {
  id: ID!
  family: Family!
  wallet: Bytes!
  ensNode: Bytes!
  ensName: String!
  active: Boolean!
  starBalance: BigInt!
  reservedStars: BigInt!
  totalStarsIssued: BigInt!
  totalStarsBurned: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
  goals: [Goal!]! @derivedFrom(field: "child")
  redemptions: [Redemption!]! @derivedFrom(field: "child")
  quests: [Quest!]! @derivedFrom(field: "child")
  starRequests: [StarRequest!]! @derivedFrom(field: "child")
}

type ChildWallet @entity(immutable: false) {
  id: Bytes!
  child: Child!
}

type StarBalance @entity(immutable: false) {
  id: Bytes!
  balance: BigInt!
  totalIssued: BigInt!
  totalBurned: BigInt!
  updatedAt: BigInt!
}

type Goal @entity(immutable: false) {
  id: ID!
  family: Family!
  child: Child!
  title: String!
  starCost: BigInt!
  allocatedStars: BigInt!
  status: GoalStatus!
  createdAt: BigInt!
  updatedAt: BigInt!
  completedAt: BigInt
  cancelledAt: BigInt
  redemptions: [Redemption!]! @derivedFrom(field: "goal")
}

type GoalRequest @entity(immutable: false) {
  id: ID!
  requestId: BigInt!
  family: Family!
  child: Child!
  title: String!
  reason: String!
  icon: Int!
  submissionId: Bytes!
  status: RedemptionStatus!
  goal: Goal
  requestedAt: BigInt!
  resolvedAt: BigInt
  requestTransactionHash: Bytes!
  resolutionTransactionHash: Bytes
}

type Redemption @entity(immutable: false) {
  id: ID!
  family: Family!
  child: Child!
  goal: Goal!
  reservedStars: BigInt!
  status: RedemptionStatus!
  requestedAt: BigInt!
  resolvedAt: BigInt
  requestTransactionHash: Bytes!
  resolutionTransactionHash: Bytes
  updatedAt: BigInt!
}

type Quest @entity(immutable: false) {
  id: ID!
  questId: BigInt!
  workflow: Bytes!
  family: Family!
  child: Child!
  title: String!
  stars: BigInt!
  status: QuestStatus!
  createdAt: BigInt!
  updatedAt: BigInt!
  requests: [StarRequest!]! @derivedFrom(field: "quest")
}

type StarRequest @entity(immutable: false) {
  id: ID!
  requestId: BigInt!
  workflow: Bytes!
  family: Family!
  child: Child!
  quest: Quest
  stars: BigInt!
  reason: String!
  submissionId: Bytes!
  status: StarRequestStatus!
  rewardId: BigInt
  createdAt: BigInt!
  updatedAt: BigInt!
  creationTransactionHash: Bytes!
  resolutionTransactionHash: Bytes
}
