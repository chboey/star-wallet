specVersion: 1.3.0
description: Star Wallet primary application read model on Sepolia
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: StarRegistry
    network: sepolia
    source:
      abi: StarRegistry
      address: "0x23920ff112b125bad86e2e29b8986c4b29815886"
      startBlock: 11675795
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Family
        - Child
        - ChildWallet
        - ChildRegistration
        - PendingChildRegistration
        - SavingsAccount
        - ProtocolActivity
      abis:
        - name: StarRegistry
          file: ./abis/StarRegistry.json
      eventHandlers:
        - event: FamilyCreated(indexed uint256,indexed address,indexed bytes32,string)
          handler: handleFamilyCreated
        - event: FamilyStatusUpdated(indexed uint256,indexed address,bool)
          handler: handleFamilyStatusUpdated
        - event: ChildRegistered(indexed uint256,indexed uint256,indexed
            address,bytes32,string)
          handler: handleChildRegistered
        - event: ChildRegistrationProposed(indexed bytes32,indexed uint256,indexed
            address,bytes32,string)
          handler: handleChildRegistrationProposed
        - event: ChildRegistrationCancelled(indexed bytes32,indexed uint256,indexed
            address,address)
          handler: handleChildRegistrationCancelled
        - event: ChildRegistrationAccepted(indexed bytes32,indexed uint256,indexed
            uint256,address)
          handler: handleChildRegistrationAccepted
        - event: ChildStatusUpdated(indexed uint256,indexed uint256,bool)
          handler: handleChildStatusUpdated
      file: ./src/registry.ts
  - kind: ethereum/contract
    name: StarToken
    network: sepolia
    source:
      abi: StarToken
      address: "0x5d5b0b72ea18aada8706412885ef64b53a2026fe"
      startBlock: 11675796
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - StarBalance
        - Child
        - ChildWallet
      abis:
        - name: StarToken
          file: ./abis/StarToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/token.ts
  - kind: ethereum/contract
    name: StarGoals
    network: sepolia
    source:
      abi: StarGoals
      address: "0x5b590d77cabee4ac8692a071b303095304c28416"
      startBlock: 11675797
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Goal
        - GoalRequest
        - Redemption
        - Child
        - ProtocolActivity
      abis:
        - name: StarGoals
          file: ./abis/StarGoals.json
      eventHandlers:
        - event: GoalCreated(indexed uint256,indexed uint256,uint256,string)
          handler: handleGoalCreated
        - event: GoalStarsAdded(indexed uint256,indexed uint256,uint256,uint256)
          handler: handleGoalStarsAdded
        - event: GoalRequested(indexed uint256,indexed
            uint256,string,string,uint8,bytes32)
          handler: handleGoalRequested
        - event: GoalRequestApproved(indexed uint256,indexed uint256)
          handler: handleGoalRequestApproved
        - event: GoalRequestRejected(indexed uint256)
          handler: handleGoalRequestRejected
        - event: GoalRequestCancelled(indexed uint256)
          handler: handleGoalRequestCancelled
        - event: GoalCancelled(indexed uint256,indexed uint256)
          handler: handleGoalCancelled
        - event: GoalCompleted(indexed uint256,indexed uint256)
          handler: handleGoalCompleted
        - event: RedemptionRequested(indexed uint256,indexed uint256,indexed
            uint256,uint256)
          handler: handleRedemptionRequested
        - event: RedemptionApproved(indexed uint256,indexed uint256)
          handler: handleRedemptionApproved
        - event: RedemptionRejected(indexed uint256,indexed uint256)
          handler: handleRedemptionRejected
        - event: RedemptionCancelled(indexed uint256,indexed uint256)
          handler: handleRedemptionCancelled
      file: ./src/goals.ts
  - kind: ethereum/contract
    name: StarFamilyVaultFactory
    network: sepolia
    source:
      abi: StarFamilyVaultFactory
      address: "0x9849e859c38f4c28a900ec066472ce78e2b29567"
      startBlock: 11675798
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Family
        - FamilyVault
        - SavingsAccount
        - ProtocolActivity
        - ProtocolState
      abis:
        - name: StarFamilyVaultFactory
          file: ./abis/StarFamilyVaultFactory.json
        - name: StarFamilyVault
          file: ./abis/StarFamilyVault.json
      eventHandlers:
        - event: FamilyVaultCreated(indexed uint256,indexed address,indexed
            address,address)
          handler: handleFamilyVaultCreated
      file: ./src/factory.ts
  - kind: ethereum/contract
    name: Aqua
    network: sepolia
    source:
      abi: Aqua
      address: "0x38C8c7073cEc4153fA090f819528E69a857f3D90"
      startBlock: 11675793
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AquaExecution
        - FamilyVault
        - SavingsPosition
        - StrategyPosition
        - PendingStrategyExecutions
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
        - event: Docked(address,address,bytes32)
          handler: handleDocked
      file: ./src/aqua.ts
  - kind: ethereum/contract
    name: AquaSwapVM
    network: sepolia
    source:
      abi: AquaSwapVM
      address: "0x2b893B0B15D71E735BB975daF8ffe26CEC449629"
      startBlock: 11675794
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AquaExecution
        - FamilyVault
        - SavingsPosition
        - StrategyPosition
        - PendingStrategyExecutions
      abis:
        - name: AquaSwapVM
          file: ./abis/AquaSwapVM.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/aqua.ts
templates:
  - kind: ethereum/contract
    name: StarQuestsTemplate
    network: sepolia
    source:
      abi: StarQuests
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Quest
        - StarRequest
      abis:
        - name: StarQuests
          file: ./abis/StarQuests.json
      eventHandlers:
        - event: QuestCreated(indexed uint256,indexed uint256,uint256,string)
          handler: handleQuestCreated
        - event: QuestStatusUpdated(indexed uint256,uint8)
          handler: handleQuestStatusUpdated
        - event: StarRequestCreated(indexed uint256,indexed uint256,indexed
            uint256,uint256,string,bytes32)
          handler: handleStarRequestCreated
        - event: StarRequestResolved(indexed uint256,uint8,uint256)
          handler: handleStarRequestResolved
      file: ./src/quests.ts
  - kind: ethereum/contract
    name: StarFamilyVaultTemplate
    network: sepolia
    source:
      abi: StarFamilyVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FamilyVault
        - Reward
        - Child
        - SavingsAccount
        - SavingsContribution
        - SavingsWithdrawal
        - SavingsPosition
        - StrategyPosition
        - ProtocolActivity
        - ProtocolState
        - AquaExecution
        - PendingStrategyExecutions
      abis:
        - name: StarFamilyVault
          file: ./abis/StarFamilyVault.json
      eventHandlers:
        - event: StarsRewarded(indexed uint256,indexed uint256,uint256,uint256,string)
          handler: handleStarsRewarded
        - event: PrincipalContributed(indexed uint256,indexed uint256,uint256)
          handler: handlePrincipalContributed
        - event: SavingsUsdcWithdrawn(indexed uint256,uint256,uint256,indexed address)
          handler: handleSavingsUsdcWithdrawn
        - event: StrategyWethFunded(indexed uint256,uint256)
          handler: handleStrategyWethFunded
        - event: StrategyWethWithdrawn(indexed uint256,uint256,indexed address)
          handler: handleStrategyWethWithdrawn
        - event: SavingsPositionUpdated(indexed uint256,indexed
            bytes32,uint256,uint256,bool)
          handler: handleSavingsPositionUpdated
        - event: SavingsPositionToppedUp(indexed uint256,indexed bytes32,uint256,uint256)
          handler: handleSavingsPositionToppedUp
        - event: SavingsStrategyConfigured(indexed uint256,indexed
            bytes32,uint256,uint256,uint16,uint64,uint40,uint256)
          handler: handleSavingsStrategyConfigured
        - event: AquaPauseUpdated(indexed address,bool)
          handler: handleAquaPauseUpdated
      file: ./src/vault.ts
